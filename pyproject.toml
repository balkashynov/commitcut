[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "commitcut"
version = "0.1.0"
description = "Crash your webhook worker at PostgreSQL acknowledgement boundaries and verify recovery"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
commitcut = "commitcut.cli:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
commitcut = ["report.html"]
