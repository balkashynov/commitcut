<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">CommitCut: retry succeeded, fulfillment did not</title>
  <desc id="desc">A recorded PostgreSQL test. The duplicate-delivery baseline passes. The database commits an event receipt, CommitCut kills the worker before the database response reaches it, and both redeliveries return HTTP 204. The customer has zero credits instead of ten.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a30"/><stop offset="1" stop-color="#090e1b"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#aa96ff"/><stop offset="1" stop-color="#72d8f4"/></linearGradient>
  </defs>
  <rect width="1280" height="640" rx="24" fill="url(#bg)"/>
  <path d="M0 1H1280" stroke="url(#accent)" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif">
    <g transform="translate(52 48)" fill="none" stroke="#b5a3ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 0H0V32H12M32 0H44V32H32M26 -2L18 34"/>
    </g>
    <text x="112" y="75" fill="#f3f5ff" font-size="34" font-weight="700" letter-spacing="-1">CommitCut</text>
    <text x="52" y="124" fill="#9ba9c5" font-size="17" letter-spacing="2">POSTGRESQL CRASH TESTING FOR WEBHOOK HANDLERS</text>
    <rect x="896" y="44" width="332" height="44" rx="22" fill="#11352f" stroke="#27584e"/>
    <circle cx="921" cy="66" r="5" fill="#72e6b7"/>
    <text x="937" y="72" fill="#a5f3d6" font-size="17">Duplicate-delivery baseline: PASS</text>

    <text x="52" y="217" fill="#f3f5ff" font-size="64" font-weight="700" letter-spacing="-2">Retry succeeded.</text>
    <text x="52" y="290" fill="#b5a3ff" font-size="64" font-weight="700" letter-spacing="-2">Fulfillment didn't.</text>
    <text x="54" y="333" fill="#a9b6ce" font-size="23">Find the crash window your happy-path test misses.</text>

    <rect x="927" y="164" width="301" height="178" rx="16" fill="#201c2c" stroke="#554052"/>
    <text x="951" y="200" fill="#c0a9b4" font-size="16" letter-spacing="1">CREDITS AFTER RECOVERY</text>
    <text x="951" y="274" fill="#ffad98" font-size="76" font-weight="700">0</text>
    <text x="1010" y="271" fill="#c0a9b4" font-size="29">/ 10 expected</text>
    <text x="951" y="312" fill="#e2b9b2" font-size="17">Both redeliveries returned 204.</text>

    <g transform="translate(52 387)">
      <rect width="350" height="119" rx="14" fill="#151f34" stroke="#2e3d57"/>
      <text x="23" y="31" fill="#8393b0" font-size="15" letter-spacing="1.5">01 / DATABASE</text>
      <text x="23" y="63" fill="#e9edfa" font-size="24" font-weight="600">Event receipt committed</text>
      <text x="23" y="94" fill="#9fadc6" font-size="18">Credit grant has not happened.</text>
    </g>
    <path d="M416 447H443M436 440L443 447L436 454" fill="none" stroke="#7586a6" stroke-width="2"/>
    <g transform="translate(465 387)">
      <rect width="350" height="119" rx="14" fill="#261e31" stroke="#6c4560"/>
      <text x="23" y="31" fill="#c19aaa" font-size="15" letter-spacing="1.5">02 / COMMITCUT</text>
      <text x="23" y="63" fill="#ffb39f" font-size="24" font-weight="600">Kill before acknowledgement</text>
      <text x="23" y="94" fill="#c4a9ba" font-size="18">Real SIGKILL. Database survives.</text>
    </g>
    <path d="M829 447H856M849 440L856 447L849 454" fill="none" stroke="#7586a6" stroke-width="2"/>
    <g transform="translate(878 387)">
      <rect width="350" height="119" rx="14" fill="#151f34" stroke="#2e3d57"/>
      <text x="23" y="31" fill="#8393b0" font-size="15" letter-spacing="1.5">03 / RESTART + REDELIVER</text>
      <text x="23" y="63" fill="#e9edfa" font-size="24" font-weight="600">“Already handled”</text>
      <text x="23" y="94" fill="#9fadc6" font-size="18">A successful response hides a loss.</text>
    </g>
    <path d="M52 548H1228" stroke="#2a354c"/>
    <text x="52" y="588" fill="#aab8d1" font-size="19">Rust wire-protocol proxy</text>
    <circle cx="306" cy="582" r="3" fill="#596987"/>
    <text x="326" y="588" fill="#aab8d1" font-size="19">Real PostgreSQL + pg / Prisma</text>
    <circle cx="632" cy="582" r="3" fill="#596987"/>
    <text x="652" y="588" fill="#aab8d1" font-size="19">Repeatable CI evidence</text>
    <text x="1228" y="588" text-anchor="end" fill="#7585a2" font-size="17">Recorded claim-first fixture</text>
  </g>
</svg>
