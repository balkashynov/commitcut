[package]
name = "commitcut-proxy"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Hold PostgreSQL replies so a test runner can stop the app before it receives them"

[[bin]]
name = "commitcut-proxy"
path = "native/src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
